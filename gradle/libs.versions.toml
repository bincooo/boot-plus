# 版本取自根 pom.xml properties
[versions]
spring-boot = "4.1.2"
mybatis-spring-boot = "4.1.0"
druid = "1.2.28"
yauaa = "8.3.0"
kaptcha = "2.3.3"
fastjson = "2.0.66"
oshi = "7.7.3"
commons-io = "2.22.0"
poi = "6.0.0"
jwt = "0.13.0"
mybatis-plus = "3.5.18"
mapstruct-plus = "1.5.3"
lombok = "1.18.48"
lombok-mapstruct-binding = "0.2.0"

[libraries]
# BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# mybatis-plus
mybatis-plus-extension = { module = "com.baomidou:mybatis-plus-extension", version.ref = "mybatis-plus" }
mybatis-plus-spring-boot4-starter = { module = "com.baomidou:mybatis-plus-spring-boot4-starter", version.ref = "mybatis-plus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser-4.9", version.ref = "mybatis-plus" }

# druid
druid-spring-boot4-starter = { module = "com.alibaba:druid-spring-boot-4-starter", version.ref = "druid" }

# mapstruct-plus
mapstruct-plus-spring-boot-starter = { module = "io.github.linpeilie:mapstruct-plus-spring-boot-starter", version.ref = "mapstruct-plus" }
mapstruct-plus-processor = { module = "io.github.linpeilie:mapstruct-plus-processor", version.ref = "mapstruct-plus" }

# 其他带版本依赖
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
fastjson2 = { module = "com.alibaba.fastjson2:fastjson2", version.ref = "fastjson" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }
kaptcha = { module = "pro.fessional:kaptcha", version.ref = "kaptcha" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
yauaa = { module = "nl.basjes.parse.useragent:yauaa", version.ref = "yauaa" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
